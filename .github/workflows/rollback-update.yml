# تراجُع عن آخر تحديث هوائي — زرّ الطوارئ.
#
# متى؟ حين يخرج تحديث يُعطب التطبيق على الهواتف. والتحديث يصل إلى كل جهاز،
# فعطبٌ فيه عطبٌ عند الجميع دفعةً واحدة، ولا يُنتظر له بناء.
#
# وكيف؟ بنشر تحديثٍ جديد من نسخةٍ سابقة من الشفرة — لا بأمر «rollback» في
# ‏eas: جرّبناه فاختلفت أسماء خياراته بين إصدارات الأداة ووقف عند «خيار غير
# موجود» في اللحظة التي لا تحتمل. و«انشر من نسخة سابقة» يستعمل الأمر نفسه
# الذي يعمل كل يوم، بخياراته نفسها.
#
# والنتيجة على الهاتف: يُغلق التطبيق ويُفتح مرّتين — الأولى ينزّل، والثانية
# يعمل.
name: تراجَع عن التحديث

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "النسخة التي نعود إليها (رقم commit أو فرع)"
        type: string
        required: true
      message:
        description: "ماذا جرى؟ (يظهر في سجلّ التحديثات)"
        type: string
        required: false
        default: "تراجُع عن تحديث معطوب"

jobs:
  rollback:
    name: أعد الهواتف إلى النسخة العاملة
    runs-on: ubuntu-latest
    steps:
      - name: أنزل النسخة السابقة
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: هيّئ Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تحقّق من الأسرار
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          [ -z "$URL" ] && missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -z "$ANON" ] && missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::ينقص سرّ:$missing"
            exit 1
          fi

      - name: ثبّت المكتبات
        run: npm ci

      # ولا فحوص هنا: النسخة التي نعود إليها كانت تعمل، والفحص تأخيرٌ بلا
      # فائدة في لحظةٍ التطبيق فيها لا يفتح عند أحد.
      - name: اربط القناة بالفرع
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest channel:create production --non-interactive || echo "القناة موجودة."
          npx --yes eas-cli@latest channel:edit production --branch production --non-interactive

      - name: انشر النسخة السابقة
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_USE_MOCK_DATA: "false"
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
            echo "EXPO_PUBLIC_USE_MOCK_DATA=false"
            echo "EXPO_PUBLIC_VERIFY_CHANNEL=email"
            echo "EXPO_PUBLIC_BUILD_STAMP=تراجُع $(TZ=Asia/Muscat date +'%Y-%m-%d %H:%M')"
          } > .env
          npx --yes eas-cli@latest update \
            --branch production \
            --message "${{ inputs.message }} — ${{ inputs.ref }}" \
            --non-interactive

      - name: ماذا بعد
        if: success()
        run: |
          {
            echo "### تمّ التراجع"
            echo ""
            echo "أغلق التطبيق تمامًا وافتحه **مرّتين**: الأولى ينزّل، والثانية يعمل."
          } >> $GITHUB_STEP_SUMMARY
